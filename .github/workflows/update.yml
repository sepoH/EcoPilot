name: Update website

on:
  schedule:
    # 07:03, 09:03 (Oslo Børs opens at 09:00), 12:03 and 18:03 Norwegian winter time (UTC + 1).
    # GitHub uses UTC: in summer time (UTC + 2) the runs come one hour later in Norwegian time.
    - cron: "3 6,8,11,17 * * *"
  workflow_dispatch: {}
  push:
    branches: [main, main-QuantAnalytics]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Fetch fresh prices and build the page
        run: node oppdater.mjs ut symbols.json mal.html
      - name: Check the result
        run: |
          test -s ut/site/index.html
          node -e 'const i=require("./ut/index.json"); if (i.meta.withData < 300) { console.error("Too few funds with data:", i.meta.withData); process.exit(1) } console.log("Funds with data:", i.meta.withData, "stocks with data:", i.meta.stocksWithData + (i.meta.usStocksWithData || 0))'
      - name: Save the symbol list
        run: |
          cp ut/symbols.json symbols.json
          git config user.name "website-bot"
          git config user.email "actions@users.noreply.github.com"
          git add symbols.json
          git diff --cached --quiet || (git commit -m "Update symbols" && git push)
      - name: Publish to the gh-pages branch (GitHub Pages)
        run: |
          mkdir site && cp -r ut/site/. site/ && touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "website-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Update website"
          for b in gh-pages gh-pages-QuantAnalytics; do git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages:$b; done
